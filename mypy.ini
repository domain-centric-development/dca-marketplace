# Type hints and `mypy --strict` over the factory's layered packages (WP-152) — a development check of this
# repository, never part of a project's verify: the factory stays stdlib-only where it runs. Every module but the
# web host and the version stamp is held to it.
#
#     python3 -m pip install mypy && python3 -m mypy
[mypy]
mypy_path = plugins/dca-factory/skills/factory-run/scripts
files =
    plugins/dca-factory/skills/factory-run/scripts/dca_factory/building_blocks.py,
    plugins/dca-factory/skills/factory-run/scripts/dca_factory/sharedkernel,
    plugins/dca-factory/skills/factory-run/scripts/dca_factory/delivery,
    plugins/dca-factory/skills/factory-run/scripts/dca_factory/infrastructure,
    plugins/dca-factory/skills/factory-run/scripts/dca_factory/spec,
    plugins/dca-factory/skills/factory-run/scripts/dca_factory/discovery
strict = True
warn_unreachable = True

# An adapter may call a local lambda or closure that carries no types, or the web host, and return what `json` read
# (45 calls and returns in 14 adapters).
[mypy-dca_factory.delivery.adapter.*,dca_factory.delivery.api.*,dca_factory.spec.adapter.*,dca_factory.spec.api.*,dca_factory.discovery.adapter.*,dca_factory.discovery.api.*]
disallow_untyped_calls = False
warn_return_any = False

[mypy-dca_factory.contract,dca_factory.web.*]
ignore_errors = True
