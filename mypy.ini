# Type hints and `mypy --strict` over the factory's layered packages (WP-152) — a development check of this
# repository, never part of a project's verify: the factory stays stdlib-only where it runs. The list widens move
# by move; the modules not yet moved into a context are read for their names, not held to the check.
#
#     python3 -m pip install mypy && python3 -m mypy
[mypy]
mypy_path = plugins/dca-factory/skills/factory-run/scripts
files =
    plugins/dca-factory/skills/factory-run/scripts/dca_factory/building_blocks.py,
    plugins/dca-factory/skills/factory-run/scripts/dca_factory/sharedkernel
strict = True
warn_unreachable = True

[mypy-dca_factory.cli,dca_factory.contract,dca_factory.gate,dca_factory.page,dca_factory.reports,dca_factory.requests,dca_factory.runner,dca_factory.service,dca_factory.spec,dca_factory.state,dca_factory.tools,dca_factory.fonts]
ignore_errors = True
